<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>CryptoScreen Hybrid</title>

<style>

*{
    box-sizing:border-box
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font:inherit
}

header{
    height:58px;
    padding:10px 14px;
    background:rgba(8,11,16,.97);
    border-bottom:1px solid #202631;
    display:flex;
    align-items:center;
    position:relative;
    z-index:20;
}

.header-inner{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#00d68f;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

#signalsNav{
    transform:translateY(3px);
}

.connection{
    color:#00d68f;
    font-size:11px;
}

.nav-btn{
    border:1px solid #29313e;
    background:#0b0f15;
    color:#aeb7c6;
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    font-size:11px;
}

.nav-btn.active{
    color:#00d68f;
    border-color:#00d68f;
    background:#14221e;
}

.app{
    width:100%;
    height:calc(100vh - 58px);
    overflow:hidden;
}

.page{
    width:100%;
    height:100%;
    display:none;
}

.page.active{
    display:block;
}


/* MAIN */

.main-page{
    padding:12px;
}

.main-title{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.main-title h1{
    margin:0;
    font-size:21px;
}

.main-title p{
    margin:3px 0 0;
    color:#687386;
    font-size:10px;
}

.cards-grid{
    height:calc(100% - 42px);
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.card{
    min-width:0;
    min-height:0;
    background:#10141b;
    border:1px solid #232a35;
    border-radius:14px;
    overflow:auto;
    display:flex;
    flex-direction:column;
}

.card-top{
    padding:11px;
    min-height:0;
}

.coin-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.coin-name{
    font-size:16px;
    font-weight:900;
}

.coin-symbol{
    color:#6f7a8d;
    font-size:10px;
    margin-top:2px;
}

.market-badge{
    display:inline-block;
    margin-top:4px;
    padding:3px 6px;
    border-radius:5px;
    font-size:8px;
    font-weight:800;
    background:#18221f;
    color:#00d68f;
}

.market-badge.forex{
    background:#211e18;
    color:#ffb020;
}

.change{
    padding:5px 7px;
    border-radius:7px;
    font-weight:800;
    font-size:11px;
}

.positive{
    color:#00d68f;
    background:rgba(0,214,143,.1);
}

.negative{
    color:#ff536d;
    background:rgba(255,83,109,.1);
}

.price{
    margin-top:8px;
    font-size:23px;
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    margin-top:8px;
}

.stat{
    background:#0b0f15;
    border:1px solid #1e2530;
    padding:6px;
    border-radius:7px;
    min-width:0;
}

.stat-label{
    color:#697487;
    font-size:8px;
}

.stat-value{
    margin-top:3px;
    font-size:10px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.controls{
    display:flex;
    gap:5px;
    margin-top:8px;
}

.pair-input{
    width:100%;
    min-width:0;
    background:#0b0f15;
    color:white;
    border:1px solid #2a3240;
    border-radius:7px;
    padding:7px;
    outline:none;
    font-size:11px;
}

.pair-input:focus{
    border-color:#00d68f;
}

.apply-btn{
    border:0;
    background:#00d68f;
    color:#06110d;
    border-radius:7px;
    padding:0 10px;
    font-weight:900;
    cursor:pointer;
    font-size:11px;
}

.timeframes{
    display:flex;
    gap:4px;
    margin-top:6px;
    overflow:hidden;
}

.timeframe{
    flex:0 0 auto;
    border:1px solid #29313e;
    background:#0b0f15;
    color:#8993a5;
    border-radius:5px;
    padding:5px 7px;
    cursor:pointer;
    font-size:9px;
}

.timeframe.active{
    background:#1b2925;
    color:#00d68f;
    border-color:#00d68f;
}

.signal-box{
    margin-top:7px;
    padding:8px;
    border-radius:8px;
    background:#0b0f15;
    border:1px solid #1e2530;
}

.signal-title{
    color:#697487;
    font-size:8px;
}

.signal-main{
    margin-top:2px;
    font-size:17px;
    font-weight:900;
}

.signal-buy{
    color:#00d68f
}

.signal-sell{
    color:#ff536d
}

.signal-wait{
    color:#ffb020
}

.signal-info{
    color:#8993a5;
    font-size:9px;
    margin-top:3px;
}

.signal-factors{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:5px;
}

.factor{
    padding:3px 5px;
    border-radius:4px;
    background:#141a22;
    color:#aeb7c6;
    font-size:7px;
}

.factor.good{
    color:#00d68f
}

.factor.bad{
    color:#ff536d
}

.factor.neutral{
    color:#ffb020
}

.error{
    color:#ff536d;
    font-size:9px;
    margin-top:4px;
}


/* ИСПРАВЛЕННЫЙ ГРАФИК */

.chart{
    flex:0 0 260px;
    height:260px;
    min-height:260px;
    width:100%;
    border-top:1px solid #232a35;
    background:#0b0e13;
    position:relative;
}

.chart > div{
    width:100% !important;
    height:100% !important;
    min-height:260px !important;
}


/* SIGNALS PAGE */

.signals-page{
    padding:10px;
    height:100%;
    display:flex;
    flex-direction:column;
}

.signals-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
}

.signals-title{
    font-size:19px;
    font-weight:900;
}

.add-monitor{
    border:0;
    background:#00d68f;
    color:#06110d;
    border-radius:8px;
    padding:8px 10px;
    font-weight:900;
    font-size:10px;
}

.monitor-bar{
    display:flex;
    gap:5px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:8px;
}

.monitor-bar::-webkit-scrollbar{
    display:none;
}

.monitor-chip{
    flex:0 0 auto;
    padding:6px 8px;
    background:#10141b;
    border:1px solid #252d39;
    border-radius:7px;
    color:#aeb7c6;
    font-size:9px;
}

.monitor-chip button{
    margin-left:5px;
    border:0;
    background:none;
    color:#ff536d;
    cursor:pointer;
}

.signals-columns{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.signal-column{
    min-height:0;
    background:#0b0f15;
    border:1px solid #202733;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.column-head{
    padding:8px;
    border-bottom:1px solid #202733;
    font-size:10px;
    font-weight:900;
    color:#aeb7c6;
}

.signal-list{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:6px;
}

.signal-item{
    background:#10141b;
    border:1px solid #242c38;
    border-radius:8px;
    padding:8px;
    margin-bottom:5px;
}

.signal-item-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:5px;
}

.signal-pair{
    font-size:11px;
    font-weight:900;
}

.signal-direction{
    font-size:9px;
    font-weight:900;
}

.signal-direction.buy{
    color:#00d68f
}

.signal-direction.sell{
    color:#ff536d
}

.signal-direction.flat{
    color:#ffb020
}

.signal-price{
    margin-top:5px;
    font-size:11px;
    font-weight:800;
}

.signal-meta{
    margin-top:4px;
    color:#748095;
    font-size:8px;
    display:flex;
    justify-content:space-between;
    gap:5px;
}

.progress{
    margin-top:6px;
    height:4px;
    background:#1b222d;
    border-radius:10px;
    overflow:hidden;
}

.progress-inner{
    height:100%;
    background:#00d68f;
    width:0;
}

.result{
    margin-top:5px;
    font-size:10px;
    font-weight:900;
}

.result.win{
    color:#00d68f
}

.result.loss{
    color:#ff536d
}

.result.flat{
    color:#ffb020
}

.stats-line{
    margin-top:7px;
    padding:6px 8px;
    background:#10141b;
    border:1px solid #232a35;
    border-radius:7px;
    display:flex;
    justify-content:space-between;
    font-size:8px;
    color:#8993a5;
}

.empty{
    color:#555f70;
    text-align:center;
    padding:20px 5px;
    font-size:9px;
}


/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(390px,100%);
    background:#10141b;
    border:1px solid #29313e;
    border-radius:14px;
    padding:14px;
}

.modal-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:10px;
}

.modal-input{
    width:100%;
    background:#0b0f15;
    color:#fff;
    border:1px solid #2a3240;
    border-radius:8px;
    padding:10px;
    outline:none;
}

.tf-select{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:9px;
}

.tf-option{
    border:1px solid #29313e;
    background:#0b0f15;
    color:#8993a5;
    border-radius:6px;
    padding:6px 8px;
    font-size:9px;
}

.tf-option.active{
    border-color:#00d68f;
    color:#00d68f;
    background:#14221e;
}

.modal-actions{
    display:flex;
    gap:6px;
    margin-top:12px;
}

.modal-actions button{
    flex:1;
    padding:9px;
    border-radius:7px;
    border:1px solid #29313e;
    background:#0b0f15;
    color:#aeb7c6;
}

.modal-actions .save{
    background:#00d68f;
    color:#06110d;
    border:0;
    font-weight:900;
}


@media(max-width:700px){

    .cards-grid{
        grid-template-columns:1fr;
    }

    .cards-grid .card:nth-child(n+2){
        display:none;
    }

    .signals-columns{
        grid-template-columns:1fr 1fr;
    }

    .price{
        font-size:20px;
    }

    .chart{
        flex-basis:260px;
        height:260px;
        min-height:260px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            Crypto<span>Screen</span>
        </div>

        <div class="header-right">

            <div class="connection" id="connection">
                ● Подключение...
            </div>

            <button
                class="nav-btn active"
                id="mainNav"
                onclick="showPage('main')">
                Графики
            </button>

            <button
                class="nav-btn"
                id="signalsNav"
                onclick="showPage('signals')">
                Сигналы
            </button>

        </div>

    </div>

</header>


<div class="app">


<!-- =========================================================
     MAIN
========================================================= -->

<section
    class="page active"
    id="mainPage">

    <div class="main-page">

        <div class="main-title">

            <div>

                <h1>
                    Крипто-скринер
                </h1>

                <p>
                    Crypto + Forex • графики • анализ • сигналы
                </p>

            </div>

        </div>


        <div
            class="cards-grid"
            id="grid">
        </div>

    </div>

</section>


<!-- =========================================================
     SIGNALS
========================================================= -->

<section
    class="page"
    id="signalsPage">

    <div class="signals-page">

        <div class="signals-head">

            <div class="signals-title">
                📊 Сигналы
            </div>

            <button
                class="add-monitor"
                onclick="openMonitorModal()">

                ＋ ДОБАВИТЬ

            </button>

        </div>


        <div
            class="monitor-bar"
            id="monitorBar">
        </div>


        <div class="stats-line">

            <span id="statsOpen">
                Открыто: 0
            </span>

            <span id="statsWin">
                ✅ 0
            </span>

            <span id="statsLoss">
                ❌ 0
            </span>

            <span id="statsFlat">
                ⚪ 0
            </span>

            <span id="statsWinrate">
                Win Rate: 0%
            </span>

        </div>


        <div class="signals-columns">


            <div class="signal-column">

                <div class="column-head">
                    🟢 ОТКРЫТЫЕ
                </div>

                <div
                    class="signal-list"
                    id="openSignals">
                </div>

            </div>


            <div class="signal-column">

                <div class="column-head">
                    📁 ЗАВЕРШЁННЫЕ
                </div>

                <div
                    class="signal-list"
                    id="closedSignals">
                </div>

            </div>


        </div>

    </div>

</section>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div
    class="modal"
    id="monitorModal">

    <div class="modal-box">

        <div class="modal-title">
            Добавить пару в мониторинг
        </div>


        <input
            class="modal-input"
            id="monitorInput"
            placeholder="BTCUSDT / AUDCAD / EURUSD"
        >


        <div
            class="tf-select"
            id="tfSelect">

            <button
                class="tf-option"
                data-tf="1">
                1м
            </button>

            <button
                class="tf-option"
                data-tf="5">
                5м
            </button>

            <button
                class="tf-option active"
                data-tf="15">
                15м
            </button>

            <button
                class="tf-option"
                data-tf="30">
                30м
            </button>

            <button
                class="tf-option"
                data-tf="60">
                1ч
            </button>

            <button
                class="tf-option"
                data-tf="240">
                4ч
            </button>

            <button
                class="tf-option"
                data-tf="D">
                1д
            </button>

        </div>


        <div class="modal-actions">

            <button onclick="closeMonitorModal()">
                Отмена
            </button>

            <button
                class="save"
                onclick="addMonitor()">
                Добавить
            </button>

        </div>

    </div>

</div>


<script>


/* =========================================================
   TWELVE DATA
========================================================= */

const TWELVE_DATA_API_KEY =
    "c9ebc697be6f4040a031816d158751d4";


/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

const defaultCoins =
    JSON.parse(
        localStorage.getItem(
            "cryptoScreenCards"
        )
    ) || [
        "BTCUSDT",
        "ETHUSDT"
    ];


const grid =
    document.getElementById(
        "grid"
    );


const connection =
    document.getElementById(
        "connection"
    );


const cards = {};


let socket = null;


/* =========================================================
   FOREX
========================================================= */

const forexPairs = new Set([

    "EURUSD",
    "GBPUSD",
    "USDJPY",
    "USDCHF",
    "USDCAD",
    "AUDUSD",
    "NZDUSD",

    "EURGBP",
    "EURJPY",
    "EURCHF",
    "EURAUD",
    "EURCAD",
    "EURNZD",

    "GBPJPY",
    "GBPCHF",
    "GBPAUD",
    "GBPCAD",
    "GBPNZD",

    "AUDJPY",
    "AUDCAD",
    "AUDNZD",
    "AUDCHF",

    "NZDJPY",
    "NZDCAD",
    "NZDCHF",

    "CADJPY",
    "CADCHF",
    "CHFJPY"

]);


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeInput(value){

    return value
        .trim()
        .toUpperCase()
        .replace(/\s+/g,"")
        .replace("/","");

}


function isForexSymbol(symbol){

    return forexPairs.has(
        normalizeInput(symbol)
    );

}


function normalizeForex(symbol){

    const clean =
        normalizeInput(symbol);

    return (
        clean.substring(0,3) +
        "/" +
        clean.substring(3,6)
    );

}


function normalizeCrypto(symbol){

    let clean =
        normalizeInput(symbol);

    if(!clean.endsWith("USDT"))
        clean += "USDT";

    return clean;

}


/* =========================================================
   TIMEFRAMES
========================================================= */

function timeframeMinutes(tf){

    const map = {

        "1":1,
        "5":5,
        "15":15,
        "30":30,
        "60":60,
        "240":240,
        "D":1440

    };

    return map[tf] || 5;

}


function timeframeLabel(tf){

    const map = {

        "1":"1м",
        "5":"5м",
        "15":"15м",
        "30":"30м",
        "60":"1ч",
        "240":"4ч",
        "D":"1д"

    };

    return map[tf] || tf;

}


/* =========================================================
   PERSIST CARD SETTINGS
========================================================= */

function saveCards(){

    const symbols =
        Object.values(cards)
            .map(c => {

                if(c.type === "forex")
                    return c.symbol.replace("/","");

                return c.symbol;

            });


    localStorage.setItem(
        "cryptoScreenCards",
        JSON.stringify(symbols)
    );

}


/* =========================================================
   CARD CREATION
========================================================= */

function createCards(){

    grid.innerHTML = "";


    defaultCoins.forEach(
        (symbol,index)=>{

            const clean =
                normalizeInput(symbol);


            const forex =
                isForexSymbol(clean);


            const actualSymbol =
                forex
                    ? normalizeForex(clean)
                    : normalizeCrypto(clean);


            const card =
                document.createElement("div");


            card.className =
                "card";


            card.innerHTML = `

                <div class="card-top">

                    <div class="coin-row">

                        <div>

                            <div
                                class="coin-name"
                                id="name-${index}">
                                ${forex
                                    ? actualSymbol
                                    : actualSymbol.replace(
                                        "USDT",
                                        ""
                                    )}
                            </div>


                            <div
                                class="coin-symbol"
                                id="symbol-${index}">
                                ${actualSymbol}
                            </div>


                            <div
                                class="market-badge ${forex ? "forex":""}"
                                id="market-${index}">
                                ${forex
                                    ? "FOREX"
                                    : "CRYPTO"}
                            </div>

                        </div>


                        <div
                            class="change positive"
                            id="change-${index}">
                            0.00%
                        </div>

                    </div>


                    <div
                        class="price"
                        id="price-${index}">
                        ---
                    </div>


                    <div class="stats">


                        <div class="stat">

                            <div class="stat-label">
                                Максимум
                            </div>

                            <div
                                class="stat-value"
                                id="high-${index}">
                                ---
                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-label">
                                Минимум
                            </div>

                            <div
                                class="stat-value"
                                id="low-${index}">
                                ---
                            </div>

                        </div>


                        <div class="stat">

                            <div class="stat-label">
                                Объём
                            </div>

                            <div
                                class="stat-value"
                                id="volume-${index}">
                                ---
                            </div>

                        </div>


                    </div>


                    <div class="controls">

                        <input
                            class="pair-input"
                            id="input-${index}"
                            value="${actualSymbol}"
                            placeholder="BTC / AUDCAD"
                        >


                        <button
                            class="apply-btn"
                            onclick="changePair(${index})">
                            OK
                        </button>

                    </div>


                    <div class="timeframes">


                        <button
                            class="timeframe"
                            onclick="changeTimeframe(
                                ${index},
                                '1',
                                this
                            )">
                            1м
                        </button>


                        <button
                            class="timeframe active"
                            onclick="changeTimeframe(
                                ${index},
                                '5',
                                this
                            )">
                            5м
                        </button>


                        <button
                            class="timeframe"
                            onclick="changeTimeframe(
                                ${index},
                                '15',
                                this
                            )">
                            15м
                        </button>


                        <button
                            class="timeframe"
                            onclick="changeTimeframe(
                                ${index},
                                '30',
                                this
                            )">
                            30м
                        </button>


                        <button
                            class="timeframe"
                            onclick="changeTimeframe(
                                ${index},
                                '60',
                                this
                            )">
                            1ч
                        </button>


                        <button
                            class="timeframe"
                            onclick="changeTimeframe(
                                ${index},
                                '240',

/* =========================================================
   BINANCE
========================================================= */

function connectBinance(){

    if(socket){

        try{
            socket.close();
        }
        catch(e){}

    }


    const symbols =
        Object.values(cards)
            .filter(
                c=>c.type==="crypto"
            )
            .map(
                c=>c.symbol.toLowerCase()
            );


    if(!symbols.length){

        connection.textContent =
            "● Forex режим";

        connection.style.color =
            "#ffb020";

        return;

    }


    const streams =
        symbols
            .map(
                s=>s+"@ticker"
            )
            .join("/");


    socket =
        new WebSocket(
            "wss://stream.binance.com:9443/stream?streams="+
            streams
        );


    socket.onopen = ()=>{

        connection.textContent =
            "● Binance: онлайн";

        connection.style.color =
            "#00d68f";

    };


    socket.onmessage = event=>{

        try{

            const message =
                JSON.parse(
                    event.data
                );


            const data =
                message.data;


            if(
                !data ||
                !data.s
            )
                return;


            Object.keys(cards)
                .forEach(index=>{

                    if(
                        cards[index].type==="crypto" &&
                        cards[index].symbol===data.s
                    ){

                        updateCard(
                            index,
                            data
                        );

                    }

                });

        }
        catch(e){}

    };


    socket.onerror = ()=>{

        connection.textContent =
            "● Binance: ошибка";

        connection.style.color =
            "#ff536d";

    };


    socket.onclose = ()=>{

        connection.textContent =
            "● Переподключение...";

        connection.style.color =
            "#ffb020";


        setTimeout(
            connectBinance,
            3000
        );

    };

}

function twelveInterval(interval){

    const map={

        "1":"1min",
        "5":"5min",
        "15":"15min",
        "30":"30min",
        "60":"1h",
        "240":"4h",
        "D":"1day"

    };

    return map[interval] || "5min";

}


async function getForexKlines(
    symbol,
    interval
){

    if(
        !TWELVE_DATA_API_KEY ||
        TWELVE_DATA_API_KEY.includes(
            "PASTE_YOUR"
        )
    ){

        throw new Error(
            "Не указан API-ключ Twelve Data"
        );

    }


    const pair =
        normalizeForex(symbol);


    const url =
        "https://api.twelvedata.com/time_series"+
        "?symbol="+
        encodeURIComponent(pair)+
        "&interval="+
        twelveInterval(interval)+
        "&outputsize=100"+
        "&apikey="+
        encodeURIComponent(
            TWELVE_DATA_API_KEY
        );


    const response =
        await fetch(url);


    if(!response.ok){

        throw new Error(
            "Ошибка Twelve Data: "+
            response.status
        );

    }


    const json =
        await response.json();


    if(
        json.status==="error" ||
        !json.values
    ){

        throw new Error(
            json.message ||
            "Forex-пара не найдена"
        );

    }


    return json.values
        .reverse()
        .map(c=>({

            time:
                new Date(
                    c.datetime
                ).getTime(),

            open:
                parseFloat(c.open),

            high:
                parseFloat(c.high),

            low:
                parseFloat(c.low),

            close:
                parseFloat(c.close),

            volume:
                parseFloat(c.volume)||0

        }));

}

/* =========================================================
   INDICATORS
========================================================= */

function ema(values,period){

    if(values.length<period)
        return null;


    const multiplier =
        2/(period+1);


    let result =
        values
            .slice(0,period)
            .reduce(
                (a,b)=>a+b,
                0
            )/period;


    for(
        let i=period;
        i<values.length;
        i++
    ){

        result =
            (values[i]-result)*
            multiplier+
            result;

    }


    return result;

}


function rsi(
    values,
    period=14
){

    if(values.length<=period)
        return 50;


    let gains=0;
    let losses=0;


    for(
        let i=1;
        i<=period;
        i++
    ){

        const diff =
            values[i]-
            values[i-1];


        if(diff>=0)
            gains+=diff;
        else
            losses-=diff;

    }


    let avgGain =
        gains/period;


    let avgLoss =
        losses/period;


    for(
        let i=period+1;
        i<values.length;
        i++
    ){

        const diff =
            values[i]-
            values[i-1];


        const gain =
            Math.max(
                diff,
                0
            );


        const loss =
            Math.max(
                -diff,
                0
            );


        avgGain =
            (
                avgGain*(period-1)+
                gain
            )/period;


        avgLoss =
            (
                avgLoss*(period-1)+
                loss
            )/period;

    }


    if(avgLoss===0)
        return 100;


    const rs =
        avgGain/avgLoss;


    return 100-
        (100/(1+rs));

}


function atr(
    candles,
    period=14
){

    if(candles.length<=period)
        return 0;


    const trs=[];


    for(
        let i=1;
        i<candles.length;
        i++
    ){

        const c=candles[i];
        const p=candles[i-1];


        trs.push(

            Math.max(

                c.high-c.low,

                Math.abs(
                    c.high-p.close
                ),

                Math.abs(
                    c.low-p.close
                )

            )

        );

    }


    return trs
        .slice(-period)
        .reduce(
            (a,b)=>a+b,
            0
        )/period;

}


function averageVolume(
    candles,
    period=20
){

    const values =
        candles
            .slice(-period)
            .map(
                c=>c.volume||0
            );


    if(!values.length)
        return 0;


    return values.reduce(
        (a,b)=>a+b,
        0
    )/values.length;

}


function macd(values){

    if(values.length<35){

        return {
            macd:0,
            signal:0
        };

    }


    const fast =
        ema(values,12);


    const slow =
        ema(values,26);


    const line =
        fast-slow;


    const previous =
        values.slice(
            0,
            values.length-1
        );


    const prevFast =
        ema(previous,12);


    const prevSlow =
        ema(previous,26);


    return {

        macd:line,

        signal:
            prevFast-prevSlow

    };

}


/* =========================================================
   CANDLE / STRUCTURE ANALYSIS
========================================================= */

function candleAnalysis(candles){

    const a =
        candles[
            candles.length-2
        ];


    const b =
        candles[
            candles.length-1
        ];


    if(!a || !b)
        return {
            score:0,
            text:"Свечи: нет данных"
        };


    const body =
        Math.abs(
            b.close-b.open
        );


    const range =
        b.high-b.low;


    if(range<=0)
        return {
            score:0,
            text:"Свечи: нейтрально"
        };


    const bodyRatio =
        body/range;


    const bullish =
        b.close>b.open;


    if(bodyRatio>.65){

        return {

            score:
                bullish?8:-8,

            text:
                bullish
                    ?"Свеча: сильный рост"
                    :"Свеча: сильное падение"

        };

    }


    return {

        score:
            bullish?2:-2,

        text:
            bullish
                ?"Свеча: бычья"
                :"Свеча: медвежья"

    };

}


/* =========================================================
   SIGNAL ALGORITHM
========================================================= */

function calculateSignal(candles){

    if(
        !candles ||
        candles.length<35
    ){

        return {

            signal:"WAIT",

            score:50,

            info:
                "Недостаточно данных",

            factors:[]

        };

    }


    const closes =
        candles.map(
            c=>c.close
        );


    const last =
        closes[
            closes.length-1
        ];


    const ema9 =
        ema(
            closes,
            9
        );


    const ema21 =
        ema(
            closes,
            21
        );


    const rsiValue =
        rsi(
            closes,
            14
        );


    const atrValue =
        atr(
            candles,
            14
        );


    const macdValue =
        macd(closes);


    const avgVol =
        averageVolume(
            candles,
            20
        );


    const currentVol =
        candles[
            candles.length-1
        ].volume||0;


    const candle =
        candleAnalysis(
            candles
        );


    let score=50;


    const factors=[];


    /* EMA */

    if(
        ema9!==null &&
        ema21!==null
    ){

        if(ema9>ema21){

            score+=15;

            factors.push({

                text:"EMA: рост",

                type:"good"

            });

        }
        else{

            score-=15;

            factors.push({

                text:"EMA: падение",

                type:"bad"

            });

        }

    }


    /* RSI */

    if(rsiValue<30){

        score+=12;

        factors.push({

            text:"RSI: перепродан",

            type:"good"

        });

    }
    else if(rsiValue>70){

        score-=12;

        factors.push({

            text:"RSI: перекуплен",

            type:"bad"

        });

    }
    else if(rsiValue>=50){

        score+=5;

        factors.push({

            text:"RSI: бычий",

            type:"good"

        });

    }
    else{

        score-=5;

        factors.push({

            text:"RSI: медвежий",

            type:"bad"

        });

    }


    /* MACD */

    if(
        macdValue.macd>
        macdValue.signal
    ){

        score+=10;

        factors.push({

            text:"MACD: бычий",

            type:"good"

        });

    }
    else{

        score-=10;

        factors.push({

            text:"MACD: медвежий",

            type:"bad"

        });

    }


    /* VOLUME */

    if(
        avgVol>0 &&
        currentVol>avgVol*1.2
    ){

        const lastCandle =
            candles[
                candles.length-1
            ];


        if(
            lastCandle.close>
            lastCandle.open
        ){

            score+=8;

            factors.push({

                text:"Объём: покупки",

                type:"good"

            });

        }
        else{

            score-=8;

            factors.push({

                text:"Объём: продажи",

                type:"bad"

            });

        }

    }
    else{

        factors.push({

            text:"Объём: обычный",

            type:"neutral"

        });

    }


    /* VOLATILITY */

    const volatility =
        last>0
            ?atrValue/last*100
            :0;


    factors.push({

        text:
            volatility>=1
                ?"Волатильность: высокая"
                :"Волатильность: нормальная",

        type:"neutral"

    });


    /* CANDLE */

    score+=candle.score;


    factors.push({

        text:candle.text,

        type:
            candle.score>0
                ?"good"
                :candle.score<0
                    ?"bad"
                    :"neutral"

    });


    score =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(score)
            )
        );


    let signal="WAIT";


    if(score>=70)
        signal="BUY";

    else if(score<=30)
        signal="SELL";


    return {

        signal,

        score,

        info:
            `Сила: ${score}/100 • RSI ${rsiValue.toFixed(1)} • ATR ${volatility.toFixed(2)}%`,

        factors

    };

}

async function loadSignal(index){

    try{

        let candles;


        if(card.type==="forex"){

            candles =
                await getForexKlines(
                    card.symbol,
                    card.interval
                );

        }
        else{

            candles =
                await getCryptoKlines(
                    card.symbol,
                    card.interval
                );

        }


        if(!candles.length)
            throw new Error(
                "Нет свечей"
            );


        const last =
            candles[
                candles.length-1
            ];


        document.getElementById(

            formatPrice(
                last.close,
                card.type

        document.getElementById(

                last.high,
                card.type
            );


        document.getElementById(
            `low-${index}`

                last.low,
                card.type
            );


        document.getElementById(
            `volume-${index}`
        ).textContent =
            formatVolume(
                last.volume,
                card.type
            );


        const result =
            calculateSignal(
                candles
            );


        showSignal(
            index,
            result
        );


        card.lastCandles =
            candles;


        card.lastResult =
            result;


        card.lastPrice =
            last.close;

    }
    catch(e){

        document.getElementById(
            `signal-${index}`
        ).textContent =
            "НЕТ ДАННЫХ";


        document.getElementById(
            `signal-info-${index}`
        ).textContent =

/* =========================================================
   FORMAT
========================================================= */

function formatPrice(
    number,
    type="crypto"
){

    if(
        number===undefined ||
        number===null ||
        isNaN(number)
    )
        return "---";


    if(type==="forex"){

        return number.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:4,
                maximumFractionDigits:5
            }
        );

    }


    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits:
                number<1?4:2,

            maximumFractionDigits:
                number<1?8:2

        }
    )+" USDT";

}


function formatVolume(
    number,
    type
){

    if(
        !number ||
        isNaN(number)
    ){

        return type==="forex"
            ?"Tick volume"
            :"---";

    }


    if(number>=1000000000)

        return (
            number/1000000000
        ).toFixed(2)+"B";


    if(number>=1000000)

        return (
            number/1000000
        ).toFixed(2)+"M";


    if(number>=1000)

        return (
            number/1000
        ).toFixed(2)+"K";


    return number.toFixed(2);

}

    );

}

    localStorage.setItem(
        tradeStorageKey,
        JSON.stringify(trades)
    );

}


/* =========================================================
   MONITOR MODAL
========================================================= */

let selectedTF =
    "15";


document
    .querySelectorAll(".tf-option")
    .forEach(button=>{

        button.onclick=()=>{

            document
                .querySelectorAll(
                    ".tf-option"
                )

                    )
                );


            button.classList.add(

            );

                button.dataset.tf;

        };

    });


function openMonitorModal(){

        .getElementById(
            "monitorModal"
        )
        .classList.add(
            "open"
        );

}


function closeMonitorModal(){

    document
        .getElementById(
            "monitorModal"
        )
        .classList.remove(
            "open"
        );

}


function addMonitor(){

    const input =
        document.getElementById(
            "monitorInput"
        );


    const value =
        normalizeInput(
            input.value
        );


    if(!value)
        return;


    const symbol =
        isForexSymbol(value)
            ?normalizeForex(value)
            :normalizeCrypto(value);


    const exists =
        monitors.some(
            m=>
                m.symbol===symbol &&
                m.interval===selectedTF
        );


    if(exists){

        closeMonitorModal();

        return;

    }


    monitors.push({

        id:
            Date.now()+"_"+Math.random(),

        symbol,

        type:
            isForexSymbol(value)
                ?"forex"
                :"crypto",

        interval:selectedTF,

        enabled:true

    });


    saveMonitors();


    input.value="";


    closeMonitorModal();


    renderMonitorBar();

}

========================================================= */

    monitors =
        monitors.filter(
            m=>m.id!==id

/* =========================================================
   TRADE CREATION
========================================================= */

function createTrade(
    monitor,
    result,
    price
){

    if(
        result.signal!=="BUY" &&
        result.signal!=="SELL"
    )
        return;


    const existing =
        trades.find(
            t=>
                !t.closed &&
                t.monitorId===monitor.id
        );


    if(existing)
        return;


    const duration =
        timeframeMinutes(
            monitor.interval
        )*60*1000;


    const now =
        Date.now();


    const trade={

        id:
            now+"_"+Math.random(),

        monitorId:
            monitor.id,

        symbol:
            monitor.symbol,

        type:
            monitor.type,

        interval:
            monitor.interval,

        direction:
            result.signal,

        score:
            result.score,

        entry:
            price,

        start:
            now,

        end:
            now+duration,

        closed:false,

        exit:null,

        result:null,

        resultValue:null

    };


    trades.unshift(
        trade
    );


    if(trades.length>500){

        trades =
            trades.slice(
                0,
                500
            );

    }


    saveTrades();

}


/* =========================================================
   TRADE UPDATE
========================================================= */

async function updateMonitor(
    monitor
){

    try{

        let candles;


        if(
            monitor.type==="forex"
        ){

            candles =
                await getForexKlines(
                    monitor.symbol,
                    monitor.interval
                );

        }
        else{

            candles =
                await getCryptoKlines(
                    monitor.symbol,
                    monitor.interval
                );

        }


        if(!candles.length)
            return;


        const last =
            candles[
                candles.length-1
            ];


        const result =
            calculateSignal(
                candles
            );


        createTrade(
            monitor,
            result,
            last.close
        );


        const openTrade =
            trades.find(
                t=>
                    !t.closed &&
                    t.monitorId===monitor.id
            );


        if(openTrade){

            openTrade.current =
                last.close;

        }

    }
    catch(e){

        console.log(
            "Monitor error:",
            e
        );

    }

}


/* =========================================================
   CLOSE EXPIRED TRADES
========================================================= */

async function closeExpiredTrades(){

    const now =
        Date.now();


    for(
        const trade of trades
    ){

        if(
            trade.closed ||
            now<trade.end
        )
            continue;


        const monitor =
            monitors.find(
                m=>
                    m.id===
                    trade.monitorId
            );


        if(!monitor)
            continue;


        try{

            let candles;


            if(
                monitor.type==="forex"
            ){

                candles =
                    await getForexKlines(
                        monitor.symbol,
                        monitor.interval
                    );

            }
            else{

                candles =
                    await getCryptoKlines(
                        monitor.symbol,
                        monitor.interval
                    );

            }


            if(!candles.length)
                continue;


            const exit =
                candles[
                    candles.length-1
                ].close;


            trade.exit =
                exit;


            const difference =
                trade.direction==="BUY"

                    ?exit-trade.entry

                    :trade.entry-exit;


            trade.resultValue =
                difference;


            if(
                Math.abs(
                    difference
                ) < 1e-12
            ){

                trade.result =
                    "FLAT";

            }
            else if(
                difference>0
            ){

                trade.result =
                    "WIN";

            }
            else{

                trade.result =
                    "LOSS";

            }


            trade.closed=true;


            trade.current =
                exit;

        }
        catch(e){

            console.log(e);

        }

    }


    saveTrades();

}


/* =========================================================
   RENDER TRADE
========================================================= */

function renderTrade(
    trade,
    open
){

    const directionClass =
        trade.direction==="BUY"
            ?"buy"
            :"sell";


    const directionIcon =
        trade.direction==="BUY"
            ?"🟢"
            :"🔴";


    const current =
        trade.current ??
        trade.entry;


    const difference =
        trade.direction==="BUY"

            ?current-trade.entry

            :trade.entry-current;


    if(open){

        const total =
            trade.end-
            trade.start;


        const remaining =
            Math.max(
                0,
                trade.end-
                Date.now()
            );


        const progress =
            Math.max(
                0,
                Math.min(
                    100,
                    (
                        1-
                        remaining/total
                    )*100
                )
            );


        return `

            <div class="signal-item">

                <div class="signal-item-top">

                    <div class="signal-pair">

                        ${directionIcon}
                        ${trade.symbol}
                        •
                        ${timeframeLabel(
                            trade.interval
                        )}

                    </div>


                    <div
                        class="signal-direction ${directionClass}">

                        ${trade.direction}

                    </div>

                </div>


                <div class="signal-price">

                    ${formatTradePrice(
                        trade.entry,
                        trade.type
                    )}

                    →

                    ${formatTradePrice(
                        current,
                        trade.type
                    )}

                </div>


                <div class="signal-meta">

                    <span>
                        Score ${trade.score}/100
                    </span>

                    <span>

                        ${formatRemaining(
                            remaining
                        )}

                    </span>

                </div>


                <div class="progress">

                    <div
                        class="progress-inner"
                        style="width:${progress}%">
                    </div>

                </div>

            </div>

        `;

    }


    const resultClass =
        trade.result==="WIN"
            ?"win"
            :trade.result==="LOSS"
                ?"loss"
                :"flat";


    const resultText =
        trade.result==="WIN"
            ?"ПРИБЫЛЬ"
            :trade.result==="LOSS"
                ?"УБЫТОК"
                :"FLAT";


    const sign =
        difference>0
            ?"+"
            :"";


    return `

        <div class="signal-item">

            <div class="signal-item-top">

                <div class="signal-pair">

                    ${directionIcon}
                    ${trade.symbol}
                    •
                    ${timeframeLabel(
                        trade.interval
                    )}

                </div>


                <div
                    class="signal-direction ${directionClass}">

                    ${trade.direction}

                </div>

            </div>


            <div class="signal-price">

                ${formatTradePrice(
                    trade.entry,
                    trade.type
                )}

                →

                ${formatTradePrice(
                    trade.exit,
                    trade.type
                )}

            </div>


            <div class="signal-meta">

                <span>
                    Score ${trade.score}/100
                </span>

                <span>

                    ${new Date(
                        trade.start
                    ).toLocaleTimeString(
                        "ru-RU",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    )}

                </span>

            </div>


            <div class="result ${resultClass}">

                ${resultText}

                ${
                    trade.result==="FLAT"
                        ?""
                        :` ${sign}${formatDifference(
                            difference,
                            trade.type
                        )}`
                }

            </div>

        </div>

    `;

}


/* =========================================================
   RENDER SIGNALS
========================================================= */

function renderSignals(){

    const open =
        trades.filter(
            t=>!t.closed
        );


    const closed =
        trades.filter(
            t=>t.closed
        );


    document.getElementById(
        "openSignals"
    ).innerHTML =

        open.length

            ?open
                .slice(0,100)
                .map(
                    t=>
                        renderTrade(
                            t,
                            true
                        )
                )
                .join("")

            :`

                <div class="empty">

                    Нет открытых сигналов

                </div>

            `;


    document.getElementById(
        "closedSignals"
    ).innerHTML =

        closed.length

            ?closed
                .slice(0,100)
                .map(
                    t=>
                        renderTrade(
                            t,
                            false
                        )
                )
                .join("")

            :`

                <div class="empty">

                    История пуста

                </div>

            `;


    updateStatistics();

}


/* =========================================================
   STATISTICS
========================================================= */

function updateStatistics(){

    const open =
        trades.filter(
            t=>!t.closed
        ).length;


    const win =
        trades.filter(
            t=>
                t.closed &&
                t.result==="WIN"
        ).length;


    const loss =
        trades.filter(
            t=>
                t.closed &&
                t.result==="LOSS"
        ).length;


    const flat =
        trades.filter(
            t=>
                t.closed &&
                t.result==="FLAT"
        ).length;


    const completed =
        win+
        loss;


    const winrate =
        completed

            ?Math.round(
                win/completed*100
            )

            :0;


    document.getElementById(
        "statsOpen"
    ).textContent =
        "Открыто: "+open;


    document.getElementById(
        "statsWin"
    ).textContent =
        "✅ "+win;


    document.getElementById(
        "statsLoss"
    ).textContent =
        "❌ "+loss;


    document.getElementById(
        "statsFlat"
    ).textContent =
        "⚪ "+flat;


    document.getElementById(
        "statsWinrate"
    ).textContent =
        "Win Rate: "+winrate+"%";

}


/* =========================================================
   FORMATTING TRADES
========================================================= */

function formatTradePrice(
    value,
    type
){

    if(
        value===undefined ||
        value===null ||
        isNaN(value)
    )
        return "---";


    if(type==="forex"){

        return Number(value)
            .toFixed(5);

    }


    if(value<1)

        return Number(value)
            .toFixed(6);


    return Number(value)
        .toFixed(2);

}


function formatDifference(
    value,
    type
){

    const abs =
        Math.abs(value);


    if(type==="forex")
        return abs.toFixed(5);


    if(abs<1)
        return abs.toFixed(4);


    return abs.toFixed(2);

}


function formatRemaining(ms){

    const total =
        Math.ceil(
            ms/1000
        );


    const hours =
        Math.floor(
            total/3600
        );


    const minutes =
        Math.floor(
            (total%3600)/60
        );


    const seconds =
        total%60;


    if(hours>0){

        return (

            String(hours)
                .padStart(2,"0")+

            ":"+

            String(minutes)
                .padStart(2,"0")+

            ":"+

            String(seconds)
                .padStart(2,"0")

        );

    }


    return (

        String(minutes)
            .padStart(2,"0")+

        ":"+

        String(seconds)
            .padStart(2,"0")

    );

}


/* =========================================================
   MONITOR LOOP
========================================================= */

let monitorBusy=false;


async function monitorLoop(){

    if(monitorBusy)
        return;


    monitorBusy=true;


    try{

        await closeExpiredTrades();


        for(
            const monitor of monitors
        ){

            if(!monitor.enabled)
                continue;


            await updateMonitor(
                monitor
            );

        }


        saveTrades();


        renderSignals();

    }
    catch(e){

        console.log(e);

    }
    finally{

        monitorBusy=false;

    }

}
