<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CryptoScreen</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

#app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

header{
    height:68px;
    flex:none;
    padding:0 12px;
    border-bottom:1px solid #202631;
    background:#080b10;
    z-index:100;
}

.header-inner{
    height:100%;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:#00d68f;
}

.connection{
    margin-left:auto;
    font-size:11px;
    color:#00d68f;
    white-space:nowrap;
}

.nav{
    display:flex;
    gap:6px;
}

.nav button{
    border:1px solid #29313e;
    background:#0b0f15;
    color:#8f99aa;
    border-radius:9px;
    padding:8px 10px;
    font-weight:700;
}

.nav button.active{
    color:#00d68f;
    border-color:#00d68f;
    background:#10231e;
}

/* ================= SCREENS ================= */

.screen{
    display:none;
    flex:1;
    min-height:0;
}

.screen.active{
    display:flex;
}

/* ================= GRAPHS ================= */

#graphsScreen{
    flex-direction:column;
}

.title{
    flex:none;
    padding:10px 18px 5px;
}

.title h1{
    margin:0;
    font-size:23px;
}

.title p{
    margin:4px 0 0;
    color:#7f899b;
    font-size:12px;
}

.carousel-wrap{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
}

.carousel{
    height:100%;
    width:100%;
    display:flex;
    transition:transform .25s ease;
    touch-action:pan-y;
}

.slide{
    flex:0 0 100%;
    min-width:100%;
    height:100%;
    padding:4px 18px 17px;
}

.card{
    height:100%;
    width:100%;
    overflow:hidden;
    border:1px solid #232a35;
    border-radius:17px;
    background:#10141b;
    display:flex;
    flex-direction:column;
}

.card-top{
    flex:none;
    padding:12px;
    position:relative;
}

.delete{
    position:absolute;
    right:11px;
    top:11px;
    width:27px;
    height:27px;
    border-radius:50%;
    border:1px solid #343c49;
    background:#151a22;
    color:#798395;
    font-size:17px;
}

.delete:active{
    color:#ff536d;
}

.coin-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.coin-name{
    font-size:20px;
    font-weight:900;
}

.coin-symbol{
    color:#7e889a;
    font-size:11px;
    margin-top:2px;
}

.market{
    display:inline-block;
    margin-top:5px;
    padding:3px 6px;
    border-radius:5px;
    background:#18221f;
    color:#00d68f;
    font-size:9px;
    font-weight:800;
}

.market.forex{
    background:#211e18;
    color:#ffb020;
}

.change{
    margin-right:32px;
    padding:6px 8px;
    border-radius:7px;
    font-size:12px;
    font-weight:800;
}

.positive{
    color:#00d68f;
    background:rgba(0,214,143,.1);
}

.negative{
    color:#ff536d;
    background:rgba(255,83,109,.1);
}

.price{
    margin-top:8px;
    font-size:28px;
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:9px;
}

.stat{
    min-width:0;
    padding:7px;
    border:1px solid #1e2530;
    border-radius:9px;
    background:#0b0f15;
}

.stat-label{
    color:#697487;
    font-size:9px;
    margin-bottom:3px;
}

.stat-value{
    font-size:11px;
    font-weight:700;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.controls{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.pair{
    flex:1;
    min-width:0;
    padding:9px;
    border-radius:8px;
    border:1px solid #2a3240;
    background:#0b0f15;
    color:#fff;
    outline:none;
}

.pair:focus{
    border-color:#00d68f;
}

.ok{
    border:0;
    border-radius:8px;
    padding:0 14px;
    background:#00d68f;
    color:#06110d;
    font-weight:900;
}

.timeframes{
    display:flex;
    gap:4px;
    margin-top:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

.timeframes::-webkit-scrollbar{
    display:none;
}

.tf{
    flex:none;
    padding:6px 8px;
    border:1px solid #29313e;
    border-radius:6px;
    background:#0b0f15;
    color:#8993a5;
    font-size:10px;
}

.tf.active{
    border-color:#00d68f;
    background:#1b2925;
    color:#00d68f;
}

.signal{
    margin-top:7px;
    padding:8px;
    border:1px solid #1e2530;
    border-radius:10px;
    background:#0b0f15;
}

.signal-label{
    color:#697487;
    font-size:9px;
}

.signal-main{
    margin-top:2px;
    font-size:18px;
    font-weight:900;
}

.buy{
    color:#00d68f;
}

.sell{
    color:#ff536d;
}

.wait{
    color:#ffb020;
}

.signal-info{
    margin-top:3px;
    color:#8993a5;
    font-size:9px;
}

.factors{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:5px;
}

.factor{
    padding:3px 5px;
    border-radius:4px;
    background:#141a22;
    font-size:8px;
}

.good{
    color:#00d68f;
}

.bad{
    color:#ff536d;
}

.neutral{
    color:#ffb020;
}

.error{
    color:#ff536d;
    font-size:9px;
    margin-top:4px;
}

/* ================= CHART ================= */

.chart{
    flex:1;
    min-height:250px;
    width:100%;
    background:#0b0e13;
    border-top:1px solid #232a35;
}

/* ================= DOTS ================= */

.dots{
    position:absolute;
    left:50%;
    bottom:7px;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    z-index:10;
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#3a424f;
}

.dot.active{
    width:17px;
    border-radius:5px;
    background:#00d68f;
}

/* ================= ADD ================= */

.add{
    position:absolute;
    right:13px;
    bottom:14px;
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#00d68f;
    color:#06110d;
    font-size:29px;
    z-index:20;
}

/* ================= SIGNALS ================= */

#signalsScreen{
    flex-direction:column;
    overflow:hidden;
}

.signals-title{
    flex:none;
    padding:10px 18px 6px;
}

.signals-title h1{
    margin:0;
    font-size:23px;
}

.signals-title p{
    margin:4px 0 0;
    color:#7f899b;
    font-size:11px;
}

.columns{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    padding:4px 10px 10px;
}

.column{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid #202733;
    border-radius:12px;
    background:#0d1118;
}

.column-title{
    flex:none;
    padding:8px;
    border-bottom:1px solid #202733;
    font-size:10px;
    font-weight:900;
}

.column-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:5px;
}

.trade{
    margin-bottom:5px;
    padding:7px;
    border:1px solid #252d38;
    border-radius:9px;
    background:#111720;
}

.trade-top{
    display:flex;
    justify-content:space-between;
    gap:4px;
}

.trade-pair{
    font-size:11px;
    font-weight:900;
}

.trade-tf{
    color:#8b95a6;
    font-size:9px;
    margin-top:2px;
}

.trade-side{
    font-size:9px;
    font-weight:900;
}

.trade-price{
    margin-top:5px;
    font-size:10px;
    font-weight:700;
}

.trade-timer{
    margin-top:4px;
    color:#ffb020;
    font-size:9px;
}

.result{
    margin-top:4px;
    font-size:10px;
    font-weight:900;
}

.result.win{
    color:#00d68f;
}

.result.loss{
    color:#ff536d;
}

.result.draw{
    color:#ffb020;
}

.empty{
    padding:20px 4px;
    text-align:center;
    color:#606b7d;
    font-size:9px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .connection{
        display:none;
    }

    .logo{
        font-size:20px;
    }

    .nav button{
        padding:7px 8px;
        font-size:10px;
    }

    .slide{
        padding-left:15px;
        padding-right:15px;
    }

    .price{
        font-size:26px;
    }
}

@media(max-height:700px){

    .title p,
    .signals-title p{
        display:none;
    }

    .title,
    .signals-title{
        padding-top:6px;
    }

    .card-top{
        padding:9px;
    }

    .stats{
        margin-top:6px;
    }

    .controls{
        margin-top:6px;
    }

    .timeframes{
        margin-top:5px;
    }

    .signal{
        margin-top:5px;
        padding:6px;
    }

    .chart{
        min-height:210px;
    }
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="header-inner">

        <div class="logo">
            Crypto<span>Screen</span>
        </div>

        <div
            class="connection"
            id="connection">
            ● Подключение...
        </div>

        <div class="nav">

            <button
                id="graphsBtn"
                class="active"
                onclick="showScreen('graphs')">
                Графики
            </button>

            <button
                id="signalsBtn"
                onclick="showScreen('signals')">
                Сигналы
            </button>

        </div>

    </div>
</header>


<!-- ================= ГРАФИКИ ================= -->

<section
    id="graphsScreen"
    class="screen active">

    <div class="title">

        <h1>Крипто-скринер</h1>

        <p>
            Crypto + Forex • анализ • сигналы
        </p>

    </div>


    <div class="carousel-wrap">

        <div
            id="carousel"
            class="carousel">
        </div>

        <div
            id="dots"
            class="dots">
        </div>

        <button
            class="add"
            onclick="addCard()">
            +
        </button>

    </div>

</section>


<!-- ================= СИГНАЛЫ ================= -->

<section
    id="signalsScreen"
    class="screen">

    <div class="signals-title">

        <h1>Сигналы</h1>

        <p>
            Открытые и завершённые сделки
        </p>

    </div>


    <div class="columns">

        <div class="column">

            <div class="column-title">
                🟢 Открытые
            </div>

            <div
                id="openTrades"
                class="column-body">
            </div>

        </div>


        <div class="column">

            <div class="column-title">
                📊 Завершённые
            </div>

            <div
                id="closedTrades"
                class="column-body">
            </div>

        </div>

    </div>

</section>

</div>


<script>

/* =====================================================
   API
===================================================== */

const TWELVE_DATA_API_KEY =
    "c9ebc697be6f4040a031816d158751d4";


/* =====================================================
   STORAGE
===================================================== */

const STATE_KEY =
    "cryptoscreen_state_v5";

const TRADES_KEY =
    "cryptoscreen_trades_v5";


/* =====================================================
   DEFAULT
===================================================== */

const defaultState = {
    cards:[
        {
            symbol:"BTCUSDT",
            type:"crypto",
            interval:"5"
        }
    ],
    activeCard:0
};


let state = loadJSON(
    STATE_KEY,
    defaultState
);

let cards =
    Array.isArray(state.cards) &&
    state.cards.length
        ? state.cards
        : defaultState.cards;


let activeCard =
    Number.isInteger(state.activeCard)
        ? state.activeCard
        : 0;


if(activeCard >= cards.length)
    activeCard = cards.length - 1;


let trades =
    loadJSON(
        TRADES_KEY,
        []
    );


if(!Array.isArray(trades))
    trades = [];


let socket = null;


/* =====================================================
   HELPERS
===================================================== */

function loadJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        if(!value)
            return fallback;

        return JSON.parse(value);

    }catch(e){

        return fallback;
    }
}


function saveState(){

    localStorage.setItem(
        STATE_KEY,
        JSON.stringify({
            cards:cards,
            activeCard:activeCard
        })
    );
}


function saveTrades(){

    localStorage.setItem(
        TRADES_KEY,
        JSON.stringify(trades)
    );
}


/* =====================================================
   FOREX
===================================================== */

const forexPairs = new Set([

    "EURUSD","GBPUSD","USDJPY",
    "USDCHF","USDCAD","AUDUSD",
    "NZDUSD","EURGBP","EURJPY",
    "EURCHF","EURAUD","EURCAD",
    "EURNZD","GBPJPY","GBPCHF",
    "GBPAUD","GBPCAD","GBPNZD",
    "AUDJPY","AUDCAD","AUDNZD",
    "AUDCHF","NZDJPY","NZDCAD",
    "NZDCHF","CADJPY","CADCHF",
    "CHFJPY"

]);


function cleanSymbol(value){

    return value
        .trim()
        .toUpperCase()
        .replace(/\s+/g,"")
        .replace("/","");
}


function isForex(symbol){

    return forexPairs.has(
        cleanSymbol(symbol)
    );
}


function forexSymbol(symbol){

    const s =
        cleanSymbol(symbol);

    return (
        s.substring(0,3) +
        "/" +
        s.substring(3,6)
    );
}


function cryptoSymbol(symbol){

    let s =
        cleanSymbol(symbol);

    if(!s.endsWith("USDT"))
        s += "USDT";

    return s;
}


/* =====================================================
   SCREEN
===================================================== */

function showScreen(screen){

    const graphs =
        document.getElementById(
            "graphsScreen"
        );

    const signals =
        document.getElementById(
            "signalsScreen"
        );

    const graphsBtn =
        document.getElementById(
            "graphsBtn"
        );

    const signalsBtn =
        document.getElementById(
            "signalsBtn"
        );


    if(screen === "graphs"){

        graphs.classList.add("active");
        signals.classList.remove("active");

        graphsBtn.classList.add("active");
        signalsBtn.classList.remove("active");

        setTimeout(
            () => loadTradingView(activeCard),
            80
        );

    }else{

        graphs.classList.remove("active");
        signals.classList.add("active");

        graphsBtn.classList.remove("active");
        signalsBtn.classList.add("active");

        renderTrades();
    }
}


/* =====================================================
   CARD
===================================================== */

function cardHTML(card,index){

    const display =
        card.type === "forex"
            ? card.symbol
            : card.symbol.replace(
                "USDT",
                ""
            );


    return `

<div class="card">

<button
    class="delete"
    onclick="removeCard(${index})">
    ×
</button>

<div class="card-top">

<div class="coin-row">

<div>

<div
    class="coin-name"
    id="name-${index}">
    ${display}
</div>

<div
    class="coin-symbol"
    id="symbol-${index}">
    ${card.symbol}
</div>

<div
    class="market ${card.type === "forex" ? "forex" : ""}"
    id="market-${index}">
    ${card.type === "forex" ? "FOREX" : "CRYPTO"}
</div>

</div>

<div
    id="change-${index}"
    class="change positive">
    0.00%
</div>

</div>


<div
    id="price-${index}"
    class="price">
    ---
</div>


<div class="stats">

<div class="stat">
<div class="stat-label">Максимум</div>
<div
    id="high-${index}"
    class="stat-value">
    ---
</div>
</div>

<div class="stat">
<div class="stat-label">Минимум</div>
<div
    id="low-${index}"
    class="stat-value">
    ---
</div>
</div>

<div class="stat">
<div class="stat-label">Объём</div>
<div
    id="volume-${index}"
    class="stat-value">
    ---
</div>
</div>

</div>


<div class="controls">

<input
    id="input-${index}"
    class="pair"
    value="${card.symbol}"
    placeholder="BTCUSDT / EURUSD"
    onkeydown="
        if(event.key==='Enter')
            changePair(${index})
    "
>

<button
    class="ok"
    onclick="changePair(${index})">
    OK
</button>

</div>


<div class="timeframes">

${timeframeButton(index,card.interval,"1","1м")}
${timeframeButton(index,card.interval,"5","5м")}
${timeframeButton(index,card.interval,"15","15м")}
${timeframeButton(index,card.interval,"30","30м")}
${timeframeButton(index,card.interval,"60","1ч")}
${timeframeButton(index,card.interval,"240","4ч")}
${timeframeButton(index,card.interval,"D","1д")}

</div>


<div class="signal">

<div class="signal-label">
Торговый сигнал
</div>

<div
    id="signal-${index}"
    class="signal-main wait">
    АНАЛИЗ...
</div>

<div
    id="signal-info-${index}"
    class="signal-info">
    Получение данных...
</div>

<div
    id="factors-${index}"
    class="factors">
</div>

</div>


<div
    id="error-${index}"
    class="error">
</div>

</div>


<div
    id="chart-${index}"
    class="chart">
</div>

</div>
`;
}


function timeframeButton(
    index,
    current,
    value,
    text
){

    return `
<button
    class="tf ${current === value ? "active" : ""}"
    onclick="changeTimeframe(${index},'${value}',this)">
    ${text}
</button>
`;
}


/* =====================================================
   RENDER
===================================================== */

function renderCards(){

    const carousel =
        document.getElementById(
            "carousel"
        );

    carousel.innerHTML = "";

    cards.forEach(
        (card,index) => {

            const slide =
                document.createElement(
                    "div"
                );

            slide.className =
                "slide";

            slide.innerHTML =
                cardHTML(
                    card,
                    index
                );

            carousel.appendChild(slide);
        }
    );


    updateCarousel();

    cards.forEach(
        (_,index) => {

            loadSignal(index);
        }
    );


    setTimeout(
        () => loadTradingView(activeCard),
        100
    );


    connectBinance();
}


function updateCarousel(){

    const carousel =
        document.getElementById(
            "carousel"
        );

    carousel.style.transform =
        `translateX(-${activeCard * 100}%)`;

    updateDots();

    saveState();
}


function updateDots(){

    const dots =
        document.getElementById(
            "dots"
        );

    dots.innerHTML = "";

    cards.forEach(
        (_,index) => {

            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "dot " +
                (
                    index === activeCard
                        ? "active"
                        : ""
                );

            dots.appendChild(dot);
        }
    );
}


/* =====================================================
   SWIPE
===================================================== */

let startX = 0;
let startY = 0;

const carousel =
    document.getElementById(
        "carousel"
    );


carousel.addEventListener(
    "touchstart",
    e => {

        startX =
            e.touches[0].clientX;

        startY =
            e.touches[0].clientY;

    },
    {passive:true}
);


carousel.addEventListener(
    "touchend",
    e => {

        const endX =
            e.changedTouches[0].clientX;

        const endY =
            e.changedTouches[0].clientY;

        const dx =
            endX - startX;

        const dy =
            endY - startY;


        if(
            Math.abs(dx) < 50 ||
            Math.abs(dx) <= Math.abs(dy)
        )
            return;


        if(dx < 0){

            if(
                activeCard <
                cards.length - 1
            ){

                activeCard++;

                updateCarousel();

                setTimeout(
                    () => loadTradingView(activeCard),
                    80
                );
            }

        }else{

            if(activeCard > 0){

                activeCard--;

                updateCarousel();

                setTimeout(
                    () => loadTradingView(activeCard),
                    80
                );
            }
        }

    },
    {passive:true}
);


/* =====================================================
   ADD / REMOVE
===================================================== */

function addCard(){

    if(cards.length >= 10){

        alert(
            "Максимум 10 карточек."
        );

        return;
    }


    cards.push({

        symbol:"ETHUSDT",
        type:"crypto",
        interval:"5"

    });


    activeCard =
        cards.length - 1;

    saveState();

    renderCards();
}


function removeCard(index){

    if(cards.length === 1){

        alert(
            "Нельзя удалить последнюю карточку."
        );

        return;
    }


    if(!confirm("Удалить карточку?"))
        return;


    cards.splice(index,1);

/* =====================================================
   BINANCE
===================================================== */

function connectBinance(){

    if(socket){

        try{
            socket.close();
        }catch(e){}
    }


    const symbols =
        cards
        .filter(
            c =>
                c.type === "crypto"
        )
        .map(
            c =>
                c.symbol.toLowerCase()
        );


    if(!symbols.length){

        setConnection(
            "● Forex",
            "#ffb020"
        );

        return;
    }


    const streams =
        symbols
        .map(
            s =>
                `${s}@ticker`
        )
        .join("/");


    socket =
        new WebSocket(
            "wss://stream.binance.com:9443/stream?streams=" +
            streams
        );


    socket.onopen = () => {

        setConnection(
            "● Binance: онлайн",
            "#00d68f"
        );
    };


    socket.onmessage = e => {

        try{

            const msg =
                JSON.parse(e.data);

            const data =
                msg.data;

            if(!data || !data.s)
                return;


            cards.forEach(
                (card,index) => {

                    if(
                        card.type === "crypto" &&
                        card.symbol === data.s
                    ){

                        updateCrypto(
                            index,
                            data
                        );
                    }

                }
            );

        }catch(err){}
    };


    socket.onerror = () => {

        setConnection(
            "● Binance: ошибка",
            "#ff536d"
        );
    };


    socket.onclose = () => {

        setConnection(
            "● Переподключение...",
            "#ffb020"
        );

        setTimeout(
            () => {

                if(
                    document.visibilityState !==
                    "hidden"
                ){

                    connectBinance();
                }

            },
            5000
        );
    };
}

        )

        );

/* =====================================================
   INDICATORS
===================================================== */

function EMA(values,period){

    if(values.length < period)
        return null;


    let result =
        values
        .slice(0,period)
        .reduce(
            (a,b) => a+b,
            0
        ) / period;


    const multiplier =
        2 / (period + 1);


    for(
        let i=period;
        i<values.length;
        i++
    ){

        result =
            (
                values[i] -
                result
            ) *
            multiplier +
            result;
    }


    return result;
}


function RSI(
    values,
    period=14
){

    if(values.length <= period)
        return 50;


    let gains=0;
    let losses=0;


    for(
        let i=1;
        i<=period;
        i++
    ){

        const diff =
            values[i] -
            values[i-1];

        if(diff >= 0)
            gains += diff;
        else
            losses -= diff;
    }


    let avgGain =
        gains / period;

    let avgLoss =
        losses / period;


    for(
        let i=period+1;
        i<values.length;
        i++
    ){

        const diff =
            values[i] -
            values[i-1];

        const gain =
            Math.max(diff,0);

        const loss =
            Math.max(-diff,0);


        avgGain =
            (
                avgGain *
                (period-1) +
                gain
            ) / period;


        avgLoss =
            (
                avgLoss *
                (period-1) +
                loss
            ) / period;
    }


    if(avgLoss === 0)
        return 100;


    const rs =
        avgGain / avgLoss;


    return 100 -
        100 / (1+rs);
}


function MACD(values){

    const fast =
        EMA(values,12);

    const slow =
        EMA(values,26);


    if(
        fast === null ||
        slow === null
    ){

        return {
            line:0,
            signal:0
        };
    }


    const previous =
        values.slice(
            0,
            values.length - 1
        );


    const pf =
        EMA(previous,12);

    const ps =
        EMA(previous,26);


    return {

        line:
            fast - slow,

        signal:
            (
                pf !== null &&
                ps !== null
            )
                ? pf - ps
                : 0

    };
}


function averageVolume(
    candles,
    period=20
){

    const values =
        candles
        .slice(-period)
        .map(
            c =>
                c.volume || 0
        );


    if(!values.length)
        return 0;


    return values.reduce(
        (a,b) => a+b,
        0
    ) / values.length;
}


/* =====================================================
   SIGNAL ENGINE
===================================================== */

function calculateSignal(
    candles
){

    if(
        !candles ||
        candles.length < 35
    ){

        return {
            signal:"WAIT",
            score:50,
            info:"Недостаточно данных",
            factors:[]
        };
    }


    const closes =
        candles.map(
            c => c.close
        );


    const last =
        candles[candles.length-1];


    const ema9 =
        EMA(closes,9);

    const ema21 =
        EMA(closes,21);

    const rsi =
        RSI(closes,14);

    const macd =
        MACD(closes);

    const avgVol =
        averageVolume(
            candles
        );


    let score = 50;

    const factors = [];


    /* EMA */

    if(ema9 > ema21){

        score += 15;

        factors.push({
            text:"EMA рост",
            type:"good"
        });

    }else{

        score -= 15;

        factors.push({
            text:"EMA падение",
            type:"bad"
        });
    }


    /* RSI */

    if(rsi < 30){

        score += 12;

        factors.push({
            text:"RSI перепродан",
            type:"good"
        });

    }else if(rsi > 70){

        score -= 12;

        factors.push({
            text:"RSI перекуплен",
            type:"bad"
        });

    }else if(rsi >= 50){

        score += 5;

        factors.push({
            text:"RSI бычий",
            type:"good"
        });

    }else{

        score -= 5;

        factors.push({
            text:"RSI медвежий",
            type:"bad"
        });
    }


    /* MACD */

    if(macd.line > macd.signal){

        score += 10;

        factors.push({
            text:"MACD бычий",
            type:"good"
        });

    }else{

        score -= 10;

        factors.push({
            text:"MACD медвежий",
            type:"bad"
        });
    }


    /* VOLUME */

    const volume =
        last.volume || 0;


    if(
        avgVol > 0 &&
        volume > avgVol * 1.2
    ){

        if(last.close > last.open){

            score += 8;

            factors.push({
                text:"Объём покупки",
                type:"good"
            });

        }else{

            score -= 8;

            factors.push({
                text:"Объём продажи",
                type:"bad"
            });
        }

    }else{

        factors.push({
            text:"Объём обычный",
            type:"neutral"
        });
    }


    /* CANDLE */

    const range =
        last.high -
        last.low;


    const body =
        Math.abs(
            last.close -
            last.open
        );


    if(
        range > 0 &&
        body / range > .65
    ){

        if(last.close > last.open){

            score += 5;

            factors.push({
                text:"Сильная свеча вверх",
                type:"good"
            });

        }else{

            score -= 5;

            factors.push({
                text:"Сильная свеча вниз",
                type:"bad"
            });
        }
    }


    score =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(score)
            )
        );


    let signal =
        "WAIT";


    if(score >= 72)
        signal = "BUY";

    if(score <= 28)
        signal = "SELL";


    return {

        signal:signal,

        score:score,

        info:
            `Сила ${score}/100 • RSI ${rsi.toFixed(1)}`,

        factors:factors

    };
}

/* =====================================================
   TRADE SYSTEM
===================================================== */

function timeframeMinutes(
    interval
){

    return {

        "1":1,
        "5":5,
        "15":15,
        "30":30,
        "60":60,
        "240":240,
        "D":1440

    }[interval] || 5;
}


function timeframeName(
    interval
){

    return {

        "1":"1м",
        "5":"5м",
        "15":"15м",
        "30":"30м",
        "60":"1ч",
        "240":"4ч",
        "D":"1д"

    }[interval] || interval;
}


/*
   Начало текущей свечи.
*/

function candleStart(
    interval
){

    const ms =
        timeframeMinutes(
            interval
        ) *
        60 *
        1000;


    return Math.floor(
        Date.now() / ms
    ) * ms;
}


/* =====================================================
   CREATE AUTOMATIC TRADE
===================================================== */

function processAutomaticSignal(
    card,
    result,
    price
){

    if(
        result.signal !== "BUY" &&
        result.signal !== "SELL"
    )
        return;


    /*
       Не создаём несколько одинаковых
       сделок в одной свече.
    */

    const start =
        candleStart(
            card.interval
        );


    const alreadyExists =
        trades.some(
            t =>
                t.symbol === card.symbol &&
                t.type === card.type &&
                t.interval === card.interval &&
                t.startTime === start
        );


    if(alreadyExists)
        return;


    const duration =
        timeframeMinutes(
            card.interval
        ) *
        60 *
        1000;


    trades.push({

        id:
            Date.now() +
            Math.random(),

        symbol:
            card.symbol,

        type:
            card.type,

        interval:
            card.interval,

        side:
            result.signal,

        score:
            result.score,

        startPrice:
            Number(price),

        endPrice:null,

        startTime:start,

        endTime:
            start + duration,

        status:"open",

        result:null

    });


    saveTrades();

    renderTrades();
}


/* =====================================================
   FINISH TRADES
===================================================== */

async function updateTrades(){

    const now =
        Date.now();


    let changed = false;


    for(
        const trade of trades
    ){

        if(trade.status !== "open")
            continue;


        if(now < trade.endTime)
            continue;


        try{

            let candles;


            if(trade.type === "forex"){

                candles =
                    await getForexCandles(
                        trade.symbol,
                        trade.interval
                    );

            }else{

                candles =
                    await getCryptoCandles(
                        trade.symbol,
                        trade.interval
                    );
            }


            if(!candles.length)
                continue;


            /*
               Берём цену закрытия свечи,
               на которой закончился ТФ.
            */

            let endPrice =
                candles[
                    candles.length - 1
                ].close;


            /*
               Для результата используем
               цену закрытия последней
               доступной свечи.
            */

            trade.endPrice =
                Number(endPrice);


            /*
               ВАЖНО:
               минимальное изменение считается
               БЕЗ РЕЗУЛЬТАТА.
            */

            const difference =
                Math.abs(
                    trade.endPrice -
                    trade.startPrice
                );


            const tolerance =
                Math.max(
                    Math.abs(
                        trade.startPrice
                    ) * 0.00005,
                    trade.type === "forex"
                        ? 0.00001
                        : 0.00000001
                );


            if(
                difference <= tolerance
            ){

                trade.result =
                    "draw";

            }else if(
                trade.side === "BUY"
            ){

                trade.result =
                    trade.endPrice >
                    trade.startPrice
                        ? "win"
                        : "loss";

            }else{

                trade.result =
                    trade.endPrice <
                    trade.startPrice
                        ? "win"
                        : "loss";
            }


            trade.status =
                "closed";


            changed = true;


        }catch(error){

            console.log(
                "Ошибка завершения сделки:",
                error
            );
        }
    }


    if(changed){

        saveTrades();

        renderTrades();
    }
}

function formatRemaining(
    ms
){

    const seconds =
        Math.ceil(
            ms / 1000
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    return (
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(sec)
            .padStart(2,"0")
    );
}


/* =====================================================
   FORMAT
===================================================== */

function formatPrice(
    number,
    type
){

    if(
        number === null ||
        number === undefined ||
        isNaN(number)
    )
        return "---";


    if(type === "forex"){

        return Number(number)
            .toLocaleString(
                "en-US",
                {
                    minimumFractionDigits:4,
                    maximumFractionDigits:5
                }
            );
    }


    return Number(number)
        .toLocaleString(
            "en-US",
            {
                minimumFractionDigits:
                    number < 1 ? 4 : 2,

                maximumFractionDigits:
                    number < 1 ? 8 : 2
            }
        ) +
        " USDT";
}


function formatVolume(
    number,
    type
){

    if(
        !number ||
        isNaN(number)
    ){

        return type === "forex"
            ? "Tick"
            : "---";
    }


    if(number >= 1000000000)
        return (
            number / 1000000000
        ).toFixed(2) + "B";


    if(number >= 1000000)
        return (
            number / 1000000
        ).toFixed(2) + "M";


    if(number >= 1000)
        return (
            number / 1000
        ).toFixed(2) + "K";


    return Number(number)
        .toFixed(2);
}
